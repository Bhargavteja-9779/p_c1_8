# Full study configuration (pre-registered; see supplementary/EXPERIMENT_DESIGN_preregistration.md)
raw_data_dir: ../../data_raw          # relative to code/; populate with scripts/download_data.py
output_subdir: results
tables_subdir: tables
figures_subdir: figures
prep: snv
n0_list: [25, 50, 100, 200]
n_pilots: 20
n_pilots_split: 10          # per outer split for tasks with N < 1000 (10 splits)
n_boot: 50
ablation_n0: [50, 100]
ablation_pilots: 10
robustness:
  tasks: [["ossl", "ICRAF-MIR", "OC"], ["ossl", "KSSL-VisNIR", "clay"], ["ossl", "Neospectra-NIR", "pH"],
          ["mango", null, "DM"], ["diesel", null, "bp50"], ["tablets", null, "assay"]]
  preps: [raw, sg1]
  n0_list: [50, 100]
  n_pilots: 10
  n_boot: 30
  noise_frac: 0.25
seed_note: all seeds are derived deterministically from task names (SHA-256) and pilot indices
